<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lista de Pláticas</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;margin:0;padding:20px}
    .container{max-width:800px;margin:20px auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
    h1{text-align:center}
    ul{list-style:none;padding:0}
    li{background:#eef;padding:12px 14px;margin:10px 0;border-radius:8px}
    .btn{display:inline-block;margin:20px 0;padding:10px 16px;background:#007bff;color:#fff;text-decoration:none;border-radius:8px}
    input[type="text"],input[type="email"]{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:6px}
    button{padding:10px 14px;background:#28a745;color:#fff;border:none;border-radius:6px;cursor:pointer}
    .msg{margin-top:12px}
  </style>
</head>
<body>
  <div class="container">
    <h1>Lista de Pláticas</h1>
    <ul>
      <li>Plática 1: Introducción a la Innovación</li>
      <li>Plática 2: Liderazgo en la Era Digital</li>
      <li>Plática 3: Salud y Bienestar Laboral</li>
      <li>Plática 4: Comunicación Asertiva</li>
    </ul>

    <a class="btn" href="#registro">Registrarse</a>

    <div id="registro" style="margin-top:30px">
      <h2>Registro</h2>

      <!-- REEMPLAZA TU_ENDPOINT_FORMSPREE por tu endpoint de Formspree -->
      <form id="regForm" action="https://formspree.io/f/xpwvjobz" method="POST">
        <label>Nombre:</label>
        <input type="text" name="nombre" required />

        <label>Correo electrónico:</label>
        <input type="email" name="correo" required />

        <!-- Opcional: campo oculto para asunto -->
        <input type="hidden" name="_subject" value="Nuevo registro - Lista de pláticas" />

        <button type="submit">Enviar Registro</button>
      </form>

      <div id="mensaje" class="msg" aria-live="polite"></div>
    </div>
  </div>

  <script>
    // Interceptar envío para mostrar mensaje sin salir de la página
    const form = document.getElementById('regForm');
    const msg = document.getElementById('mensaje');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = new FormData(form);
      try {
        const resp = await fetch(form.action, {
          method: 'POST',
          body: data,
          headers: { 'Accept': 'application/json' }
        });
        if (resp.ok) {
          msg.textContent = '¡Registro enviado! Gracias.';
          form.reset();
        } else {
          msg.textContent = 'Error al enviar. Intenta de nuevo.';
        }
      } catch (err) {
        msg.textContent = 'Error de red. Revisa tu conexión.';
      }
    });
  </script>
</body>
</html>
